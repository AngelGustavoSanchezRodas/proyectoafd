<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <marker id="arrowBlue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowPurple" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#818cf8" />
    </marker>
    <marker id="arrowInit" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Contenedor con esquinas redondeadas -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Flecha de Entrada / Estado Inicial -->
  <path d="M 12 64 L 27 64" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowInit)" />

  <!-- Transición Superior (q0 -> q1 con símbolo 1) -->
  <path d="M 44 48 C 50 30, 78 30, 84 48" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowBlue)" />
  <text x="64" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">1</text>

  <!-- Transición Inferior (q1 -> q0 con símbolo 0) -->
  <path d="M 84 80 C 78 98, 50 98, 44 80" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowPurple)" />
  <text x="64" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#a5b4fc" text-anchor="middle">0</text>

  <!-- Estado Inicial q0 -->
  <circle cx="42" cy="64" r="16" fill="#1e293b" stroke="url(#blueGlow)" stroke-width="2.5" />
  <text x="42" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">q₀</text>

  <!-- Estado de Aceptación q1 (Doble Círculo Concéntrico Formal) -->
  <circle cx="86" cy="64" r="18" fill="#1e293b" stroke="url(#greenGlow)" stroke-width="2" />
  <circle cx="86" cy="64" r="14" fill="#0f172a" stroke="url(#greenGlow)" stroke-width="2" />
  <text x="86" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">q₁</text>
</svg>
