<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="appleBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="appleBlueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="appleGreenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <marker id="appleArrowBlue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#38bdf8" />
    </marker>
    <marker id="appleArrowPurple" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#818cf8" />
    </marker>
    <marker id="appleArrowInit" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="180" height="180" rx="38" fill="url(#appleBgGrad)" stroke="#3b82f6" stroke-width="3" stroke-opacity="0.4" />

  <!-- Flecha de Entrada / Estado Inicial -->
  <path d="M 18 90 L 38 90" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" marker-end="url(#appleArrowInit)" />

  <!-- Transición Superior (q0 -> q1) -->
  <path d="M 60 68 C 70 42, 110 42, 118 68" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#appleArrowBlue)" />
  <text x="90" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">1</text>

  <!-- Transición Inferior (q1 -> q0) -->
  <path d="M 118 112 C 110 138, 70 138, 62 112" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#appleArrowPurple)" />
  <text x="90" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#a5b4fc" text-anchor="middle">0</text>

  <!-- Estado Inicial q0 -->
  <circle cx="58" cy="90" r="22" fill="#1e293b" stroke="url(#appleBlueGlow)" stroke-width="3.5" />
  <text x="58" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">q₀</text>

  <!-- Estado de Aceptación q1 (Doble Círculo Concéntrico) -->
  <circle cx="120" cy="90" r="24" fill="#1e293b" stroke="url(#appleGreenGlow)" stroke-width="3" />
  <circle cx="120" cy="90" r="18" fill="#0f172a" stroke="url(#appleGreenGlow)" stroke-width="2.5" />
  <text x="120" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#a7f3d0" text-anchor="middle">q₁</text>
</svg>
